<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Sushi Délice Nador</title>
<style>
:root{--bg:#080808;--card:#121212;--gold:#d9a83f;--gold2:#f4d27b;--text:#fff;--muted:#c8c1b4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#080808ee;backdrop-filter:blur(14px);border-bottom:1px solid #6f5526;padding:16px 18px}.brand{font-family:Georgia,serif;color:var(--gold2);font-size:25px;font-weight:700}.sub{font-size:12px;color:#ddd;margin-top:3px;letter-spacing:1.5px}main{max-width:760px;margin:auto;padding:18px}.hero{border:1px solid #5c4723;border-radius:22px;padding:26px 20px;margin:8px 0 22px;background:radial-gradient(circle at 80% 0,#3b2b12,#111 45%,#0b0b0b);text-align:center}.hero h1{font-family:Georgia,serif;color:var(--gold2);font-size:34px;margin:0 0 8px}.hero p{color:var(--muted);margin:0 0 18px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid #604a23;border-radius:999px;padding:9px 14px;color:var(--gold2);background:#111}.grid{display:grid;gap:14px}.card{background:var(--card);border:1px solid #4e3b1f;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:150px 1fr;min-height:175px}.photo{background:#0f0f0f;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.info{padding:16px}.info h2{font-size:20px;margin:0 0 7px}.desc{color:#bdb5a7;font-size:13px;line-height:1.45}.price{color:var(--gold2);font-size:23px;font-weight:800;margin:12px 0}.btn{width:100%;border:0;border-radius:12px;background:var(--gold);color:#080808;font-weight:800;padding:12px;font-size:15px}.cart{position:fixed;right:16px;bottom:18px;background:var(--gold2);color:#090909;border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:0 10px 30px #000}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section h2{font-family:Georgia,serif;color:var(--gold2);margin:0}.wa{display:block;text-align:center;text-decoration:none;background:#d8a943;color:#111;font-weight:900;padding:15px;border-radius:14px;margin:24px 0}@media(max-width:520px){.card{grid-template-columns:120px 1fr}.info h2{font-size:17px}.hero h1{font-size:29px}}
</style></head><body>
<header><div class="brand">SUSHI DÉLICE NADOR</div><div class="sub">SUSHI FRAIS • FAIT MAISON • LIVRAISON À NADOR</div></header>
<main><section class="hero"><h1>Boxes & Offres Gourmandes</h1><p>Des assortiments généreux préparés avec passion.</p><div class="chips"><span class="chip">🍣 Sushi</span><span class="chip">🔥 Fry</span><span class="chip">🚚 Livraison Nador</span></div></section>
<div class="section"><h2>🍣 Sushi Box</h2></div><div id="sushi" class="grid"></div>
<div class="section"><h2>🔥 Fry Box</h2></div><div id="fry" class="grid"></div>
<a class="wa" href="https://wa.me/212788516625?text=Bonjour%20Sushi%20Délice%20Nador%2C%20je%20souhaite%20passer%20une%20commande.">📲 Commander sur WhatsApp</a>
</main><div class="cart">🛒 Panier <span id="count">0</span></div>
<script>
const products=[{"id": "sushi10", "name": "Box Sushi 10 pièces", "price": 80, "cat": "sushi", "image": "images/sushi10.jpg", "description": "10 pièces • assortiment Sushi Délice", "available": true}, {"id": "sushi15", "name": "Box Sushi 15 pièces", "price": 109, "cat": "sushi", "image": "images/sushi15.jpg", "description": "15 pièces • assortiment généreux", "available": true}, {"id": "sushi20", "name": "Box Sushi 20 pièces", "price": 145, "cat": "sushi", "image": "images/sushi20.jpg", "description": "20 pièces • grand assortiment", "available": true}, {"id": "sushi30", "name": "Box Sushi 30 pièces", "price": 215, "cat": "sushi", "image": "images/sushi30.jpg", "description": "30 pièces • à partager", "available": true}, {"id": "sushi40", "name": "Box Sushi 40 pièces", "price": 300, "cat": "sushi", "image": "images/sushi40.jpg", "description": "40 pièces • grande box premium", "available": true}, {"id": "sushi50", "name": "Box Sushi 50 pièces", "price": 390, "cat": "sushi", "image": "images/sushi50.jpg", "description": "50 pièces • Family Box", "available": true}, {"id": "sushi70", "name": "Box Sushi 70 pièces", "price": 600, "cat": "sushi", "image": "images/sushi70.jpg", "description": "70 pièces • Family XXL", "available": true}, {"id": "fry10", "name": "Box Fry 10 pièces", "price": 85, "cat": "fry", "image": "images/fry10.jpg", "description": "10 pièces • crispy", "available": true}, {"id": "fry20", "name": "Box Fry 20 pièces", "price": 170, "cat": "fry", "image": "images/fry20.jpg", "description": "20 pièces • crispy à partager", "available": true}, {"id": "fry30", "name": "Box Fry 30 pièces", "price": 230, "cat": "fry", "image": "images/fry30.jpg", "description": "30 pièces • grand format crispy", "available": true}, {"id": "fry40", "name": "Box Fry 40 pièces", "price": 300, "cat": "fry", "image": "images/fry40.jpg", "description": "40 pièces • grande box crispy", "available": true}, {"id": "fry50", "name": "Box Fry 50 pièces", "price": 395, "cat": "fry", "image": "images/fry50.jpg", "description": "50 pièces • Family Fry", "available": true}, {"id": "fry60", "name": "Box Fry 60 pièces", "price": 460, "cat": "fry", "image": "images/fry60.jpg", "description": "60 pièces • Family XXL Fry", "available": true}];
let count=0;
function add(){count++;document.getElementById('count').textContent=count}
function card(p){return '<article class="card"><div class="photo"><img src="'+p.image+'" alt="'+p.name+'"></div><div class="info"><h2>'+p.name+'</h2><div class="desc">'+p.description+'</div><div class="price">'+p.price+' DH</div><button class="btn" onclick="add()">Ajouter au panier</button></div></article>'}
document.getElementById('sushi').innerHTML=products.filter(p=>p.cat==='sushi').map(card).join('');
document.getElementById('fry').innerHTML=products.filter(p=>p.cat==='fry').map(card).join('');
</script></body></html>
